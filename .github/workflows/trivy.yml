name: Trivy PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]  # Adjust to your target branch

permissions:
  contents: read
  pull-requests: write  # Required for creating/updating PR comments

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master  # Or pin to a version like @0.28.0
        with:
          scan-type: 'fs'  # Options: 'fs' (repo), 'image-ref' (Docker), etc.
          scan-ref: '.'    # Scan the entire repo; adjust path as needed
          format: 'json'   # JSON for easy parsing; use 'table' for raw output
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'  # Adjust thresholds
          ignore-unfixed: true
          vuln-type: 'os,library'  # Customize as needed
          hide-progress: false
          scanners: 'vuln,secret,config'  # Explicitly enable secret scanning (and others)
        continue-on-error: true  # Don't fail the workflow on findings; report them

      - name: Update PR with Trivy results
        if: github.event.pull_request  # More reliable check for PR context
        uses: actions/github-script@v7
        env:
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = process.env.PR_NUMBER;

            // Read Trivy results
            let rawResults = { Results: [] };
            if (fs.existsSync('trivy-results.json')) {
              const rawData = fs.readFileSync('trivy-results.json', 'utf8');
              rawResults = JSON.parse(rawData);
              console.log('Full Results Structure:', JSON.stringify(rawResults, null, 2));
            }

            // Process results for vulnerabilities
            const vulnResult = rawResults.Results?.find(r => r.Class === 'os-pkgs' || r.Class === 'lang-pkgs') || {};
            const vulnerabilities = vulnResult.Vulnerabilities || [];
            const vulnCount = vulnerabilities.length;

            // Process results for secrets
            const secretResult = rawResults.Results?.find(r => r.Class === 'secret') || {};
            const secrets = secretResult.Secrets || [];  // Changed from Misconfigurations/Vulnerabilities
            const secretCount = secrets.length;

            // Format results as Markdown
            let body = `## Trivy Security Scan Results (Updated: ${new Date().toISOString().split('T')[0]})\n\n`;
            body += `Scan completed on \`${process.env.GITHUB_SHA}\`.\n\n`;
            body += `Found **${vulnCount}** vulnerabilities and **${secretCount}** secrets.\n\n`;

            // Vulnerabilities Section
            if (vulnCount === 0) {
              body += '### No vulnerabilities detected! ✅\n\n';
            } else {
              body += '### Critical/High Vulnerabilities\n';
              const highCritVulns = vulnerabilities.filter(v => ['CRITICAL', 'HIGH'].includes(v.Severity));
              if (highCritVulns.length === 0) {
                body += 'No critical or high severity vulnerabilities found.\n';
              } else {
                highCritVulns.forEach(vuln => {
                  body += `- **${vuln.Severity}**: ${vuln.Title || vuln.VulnerabilityID} (${vuln.PkgName}:${vuln.InstalledVersion} -> ${vuln.FixedVersion || 'unfixed'})\n`;
                  body += `  *Description*: ${vuln.Description?.substring(0, 200)}...\n`;
                  body += `  *[Details](${vuln.PrimaryURL || vuln.Reference || '#'})*\n\n`;
                });
              }
              body += '\n<details><summary>All Vulnerabilities (including Medium/Low)</summary>\n\n';
              body += '```\n' + JSON.stringify(vulnerabilities, null, 2) + '\n```\n</details>\n\n';
            }

            // Secrets Section
            if (secretCount === 0) {
              body += '### No secrets detected! 🔒\n\n';
            } else {
              body += '### Detected Secrets (Critical Issues)\n';
              body += '**Warning**: Exposed secrets can lead to breaches. Review and rotate immediately!\n';
              secrets.forEach((secret, index) => {
                const title = secret.Title || secret.RuleID || `Secret ${index + 1}`;
                const severity = secret.Severity || 'CRITICAL';
                const match = secret.Match || 'N/A';
                body += `- **${severity}**: ${title}\n`;
                body += `  *Location*: ${secret.StartLine ? `Line ${secret.StartLine}` : 'N/A'}\n`;
                body += `  *Match*: \`${match.substring(0, 50)}...\` (truncated for security)\n\n`;
              });
              body += '\n<details><summary>Full Secret Results</summary>\n\n';
              body += '```\n' + JSON.stringify(secrets, null, 2) + '\n```\n</details>\n\n';
            }

            // Add note if no sections
            if (vulnCount === 0 && secretCount === 0) {
              body += 'All clear! No issues found.\n';
            }

            // Check for existing Trivy comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(comment => 
              comment.body?.includes('## Trivy Security Scan Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log(`Updated existing Trivy comment ID ${existingComment.id}`);
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log('Created new Trivy comment');
            }
